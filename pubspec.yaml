name: herr_khaled
description: "Deutsch Welt Akademie - منصة تعلم اللغة الألمانية مع الهير خالد الحلواني"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Functional Programming (Either)
  dartz: ^0.10.1

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  talker_dio_logger: ^4.3.0
  talker_flutter: ^4.3.0

  # Dependency Injection
  get_it: ^8.0.2

  # Local Storage
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  lottie: ^3.1.3

  # Form Validation
  formz: ^0.7.0

  # Social Login

  # Utilities
  equatable: ^2.0.5
  shimmer: ^3.0.0
  connectivity_plus: ^7.1.1
  flutter_secure_storage: ^10.2.0
  flutter_local_notifications: ^17.2.1

  url_launcher: ^6.3.1
  font_awesome_flutter: ^11.0.0
  google_sign_in: ^6.2.1
  video_player: ^2.13.0
  chewie: ^1.13.1
  carousel_slider: ^5.1.2
  webview_flutter: ^4.14.1
  path_provider: ^2.1.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/deutsch_welt.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/reviews/
    - assets/reviews/
    - assets/videos/